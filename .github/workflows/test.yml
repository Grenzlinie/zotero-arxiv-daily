name: Preview Zotero papers
on:
  workflow_dispatch:

jobs:
  calculate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      #  with:
      #    repository: ${{ vars.REPOSITORY }}
      #    ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4


      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          AI4S_PAPER_EXPORT: ${{ runner.temp }}/papers/papers.json
        run: |
          export DEBUG=true
          uv run python site/prepare_config.py
          uv run python site/export_daily.py

      - uses: actions/upload-artifact@v4
        with:
          name: ai4s-preview-papers
          path: ${{ runner.temp }}/papers/papers.json
          if-no-files-found: error
